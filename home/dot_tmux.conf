# =============================================================================
#  ~/.tmux.conf
# =============================================================================
#  Prefix = BackTab (Shift-Tab).  Nearly everything lives under it.
#  i3-like tiling behavior (layout enforcement, workspace switching) is built
#  from plain tmux commands -- originally borrowed from tmux-tilish, now inlined
#  so there is no plugin dependency.
#
#  KEYBINDINGS_START
#                                KEYBINDINGS
#
#  No prefix (direct):
#    C-h/j/k/l       Focus pane left/down/up/right (passthrough vim)
#    C-1 .. C-0      Smart-switch workspace 1..10 (create/toggle)
#    C-S-1 .. C-S-0  Move current pane to workspace 1..10
#    C-Enter         New pane (split, keeps cwd, re-tiles)
#    C-S-l / C-S-x   Clear screen (passthrough vim / force)
#
#  With prefix (BTab), then --
#
#  Panes:
#    C-h/j/k/l       Resize pane left/down/up/right (repeatable)
#    H/J/K/L         Swap pane left/down/up/right (repeatable)
#    m               Zoom (fullscreen) pane toggle
#    d               Kill pane
#
#  Windows / workspaces:
#    1 .. 0          Smart-switch workspace 1..10 (create/toggle)
#                    (also the terminal-independent fallback for C-<num>)
#    ! @ # $ % ^ & * ( )   Move current pane to workspace 1..10
#                    (terminal-independent fallback for C-S-<num>)
#    Enter           New pane (fallback for C-Enter)
#    h / l           Move window left / right
#    j / k           Previous / next window
#    w               Choose window/session (visual tree picker)
#    W               Find window by name/text
#    r               Rename window
#    q               Kill window (confirm)
#
#  Layouts:
#    y               main-vertical   (one big left pane)
#    Y               even-horizontal (equal columns)
#    x               main-horizontal (one big top pane)
#    X               even-vertical   (equal rows)
#    t               tiled
#    c               Cycle layouts (y > Y > x > X > t)
#
#  Session / misc:
#    D               Detach client
#    s / S           Choose / rename session
#    T               Clock mode
#    R               Reload this config
#    :               tmux command prompt
#    g               Show this keybinding help (popup; q to close)
#
#  Copy / scrollback:
#    [               Enter copy-mode (scrollback)
#    ] / =           Paste buffer / choose paste buffer
#    / , ?           Search down / up (enters copy-mode)
#
#  Copy-mode (vi):   v begin-select, V select-line, y yank, r rectangle-toggle,
#                    C-h/j/k/l focus pane.
# KEYBINDINGS_END
# =============================================================================


# =============================================================================
#  1. SETTINGS
# =============================================================================
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:TC"
setw -g xterm-keys on

# Extended keys: lets tmux tell C-<num>, C-S-<num>, C-Enter apart (needs a
# matching terminal; see kitty.conf CSI-u maps).
set -s  extended-keys always
set -as terminal-features 'xterm*:extkeys'

set -s  escape-time 0          # responsive Esc for nvim
set -g  mode-keys vi
set -g  mouse on
set -g  repeat-time 1000       # window for -r (repeatable) keys

set -g  base-index 1           # windows/panes start at 1
setw -g pane-base-index 1
set -g  renumber-windows on

set -g  set-clipboard on       # yanks reach system clipboard (OSC 52 / SSH)
set -g  allow-passthrough on


# =============================================================================
#  2. PREFIX
# =============================================================================
unbind C-b
set -g prefix BTab
bind-key BTab send-prefix


# =============================================================================
#  3. LAYOUT ENFORCEMENT (inlined from tmux-tilish; no plugin needed)
# -----------------------------------------------------------------------------
#  Keeps the active layout tidy automatically:
#    * after a split or a pane closes, re-apply + evenly spread the layout;
#    * new windows start in the default layout below.
# =============================================================================
TILISH_DEFAULT_LAYOUT='main-vertical'

set-hook -g after-split-window 'select-layout; select-layout -E'
set-hook -g pane-exited        'select-layout; select-layout -E'
set-hook -g window-linked      "select-layout $TILISH_DEFAULT_LAYOUT; select-layout -E"


# =============================================================================
#  4. NAVIGATION (seamless tmux <-> neovim, no prefix)
# -----------------------------------------------------------------------------
#  C-h/j/k/l switch panes, but pass the key through to (n)vim when a vim-like
#  process owns the pane, so splits in either program feel identical.
# =============================================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}'  '' 'select-pane -R'


# =============================================================================
#  5. RESIZE (BTab + C-h/j/k/l, repeatable; keeps vim passthrough)
# =============================================================================
bind -r 'C-h' if-shell "$is_vim" 'send-keys C-h' 'resize-pane -L 2'
bind -r 'C-j' if-shell "$is_vim" 'send-keys C-j' 'resize-pane -D 2'
bind -r 'C-k' if-shell "$is_vim" 'send-keys C-k' 'resize-pane -U 2'
bind -r 'C-l' if-shell "$is_vim" 'send-keys C-l' 'resize-pane -R 2'


# =============================================================================
#  6. SWAP PANE (BTab + H/J/K/L)
# =============================================================================
bind -r H swap-pane -s '{left-of}'
bind -r J swap-pane -s '{down-of}'
bind -r K swap-pane -s '{up-of}'
bind -r L swap-pane -s '{right-of}'


# =============================================================================
#  7. WORKSPACES (windows)
# -----------------------------------------------------------------------------
#  Switch workspace (both are the same tilish "smart switch": select N,
#  creating it if needed, or toggle back to the last workspace if already on N):
#   * C-<num>       : no prefix (needs a CSI-u-capable terminal; see kitty.conf).
#   * BTab <num>    : with prefix. Also the terminal-independent fallback for
#                     C-<num> when the terminal can't send those CSI-u codes.
#  Move current pane into workspace N:
#   * C-S-<num>     : no prefix (needs CSI-u; see kitty.conf).
#   * BTab <shifted-num> (! @ # $ % ^ & * ( ) for 1..0) : with prefix. The
#                     terminal-independent fallback for C-S-<num>.
# =============================================================================
# C-<num>: tilish smart-switch (create / toggle)
bind-key -n 'C-1' if-shell '[ "#{window_index}" != "1" ]'  "if-shell 'tmux select-window -t :1'  '' 'new-window -t :1'"  last-window 
bind-key -n 'C-2' if-shell '[ "#{window_index}" != "2" ]'  "if-shell 'tmux select-window -t :2'  '' 'new-window -t :2'"  last-window 
bind-key -n 'C-3' if-shell '[ "#{window_index}" != "3" ]'  "if-shell 'tmux select-window -t :3'  '' 'new-window -t :3'"  last-window 
bind-key -n 'C-4' if-shell '[ "#{window_index}" != "4" ]'  "if-shell 'tmux select-window -t :4'  '' 'new-window -t :4'"  last-window 
bind-key -n 'C-5' if-shell '[ "#{window_index}" != "5" ]'  "if-shell 'tmux select-window -t :5'  '' 'new-window -t :5'"  last-window 
bind-key -n 'C-6' if-shell '[ "#{window_index}" != "6" ]'  "if-shell 'tmux select-window -t :6'  '' 'new-window -t :6'"  last-window 
bind-key -n 'C-7' if-shell '[ "#{window_index}" != "7" ]'  "if-shell 'tmux select-window -t :7'  '' 'new-window -t :7'"  last-window 
bind-key -n 'C-8' if-shell '[ "#{window_index}" != "8" ]'  "if-shell 'tmux select-window -t :8'  '' 'new-window -t :8'"  last-window 
bind-key -n 'C-9' if-shell '[ "#{window_index}" != "9" ]'  "if-shell 'tmux select-window -t :9'  '' 'new-window -t :9'"  last-window 
bind-key -n 'C-0' if-shell '[ "#{window_index}" != "10" ]' "if-shell 'tmux select-window -t :10' '' 'new-window -t :10'" last-window 

# BTab <num>: tilish smart-switch (create / toggle); also the fallback for C-<num>
bind -r 1 if-shell '[ "#{window_index}" != "1" ]'  "if-shell 'tmux select-window -t :1'  '' 'new-window -t :1'"  last-window
bind -r 2 if-shell '[ "#{window_index}" != "2" ]'  "if-shell 'tmux select-window -t :2'  '' 'new-window -t :2'"  last-window
bind -r 3 if-shell '[ "#{window_index}" != "3" ]'  "if-shell 'tmux select-window -t :3'  '' 'new-window -t :3'"  last-window
bind -r 4 if-shell '[ "#{window_index}" != "4" ]'  "if-shell 'tmux select-window -t :4'  '' 'new-window -t :4'"  last-window
bind -r 5 if-shell '[ "#{window_index}" != "5" ]'  "if-shell 'tmux select-window -t :5'  '' 'new-window -t :5'"  last-window
bind -r 6 if-shell '[ "#{window_index}" != "6" ]'  "if-shell 'tmux select-window -t :6'  '' 'new-window -t :6'"  last-window
bind -r 7 if-shell '[ "#{window_index}" != "7" ]'  "if-shell 'tmux select-window -t :7'  '' 'new-window -t :7'"  last-window
bind -r 8 if-shell '[ "#{window_index}" != "8" ]'  "if-shell 'tmux select-window -t :8'  '' 'new-window -t :8'"  last-window
bind -r 9 if-shell '[ "#{window_index}" != "9" ]'  "if-shell 'tmux select-window -t :9'  '' 'new-window -t :9'"  last-window
bind -r 0 if-shell '[ "#{window_index}" != "10" ]' "if-shell 'tmux select-window -t :10' '' 'new-window -t :10'" last-window

# C-S-<num>: move current pane into workspace N, creating N if it doesn't exist
# (digits only; keeps C-S-l free). When N is created, the new window's empty
# shell pane is killed so only the moved pane remains.
# join-pane uses -d so focus stays on the current workspace instead of
# following the pane; select-layout is targeted at :N for the same reason.
bind-key -n 'C-S-1' if-shell 'tmux join-pane -d -t :1'  '' 'new-window -dt :1;  join-pane -d -t :1;  select-pane -t :1.top-left;  kill-pane -t :1.top-left;  select-layout -t :1 -E'
bind-key -n 'C-S-2' if-shell 'tmux join-pane -d -t :2'  '' 'new-window -dt :2;  join-pane -d -t :2;  select-pane -t :2.top-left;  kill-pane -t :2.top-left;  select-layout -t :2 -E'
bind-key -n 'C-S-3' if-shell 'tmux join-pane -d -t :3'  '' 'new-window -dt :3;  join-pane -d -t :3;  select-pane -t :3.top-left;  kill-pane -t :3.top-left;  select-layout -t :3 -E'
bind-key -n 'C-S-4' if-shell 'tmux join-pane -d -t :4'  '' 'new-window -dt :4;  join-pane -d -t :4;  select-pane -t :4.top-left;  kill-pane -t :4.top-left;  select-layout -t :4 -E'
bind-key -n 'C-S-5' if-shell 'tmux join-pane -d -t :5'  '' 'new-window -dt :5;  join-pane -d -t :5;  select-pane -t :5.top-left;  kill-pane -t :5.top-left;  select-layout -t :5 -E'
bind-key -n 'C-S-6' if-shell 'tmux join-pane -d -t :6'  '' 'new-window -dt :6;  join-pane -d -t :6;  select-pane -t :6.top-left;  kill-pane -t :6.top-left;  select-layout -t :6 -E'
bind-key -n 'C-S-7' if-shell 'tmux join-pane -d -t :7'  '' 'new-window -dt :7;  join-pane -d -t :7;  select-pane -t :7.top-left;  kill-pane -t :7.top-left;  select-layout -t :7 -E'
bind-key -n 'C-S-8' if-shell 'tmux join-pane -d -t :8'  '' 'new-window -dt :8;  join-pane -d -t :8;  select-pane -t :8.top-left;  kill-pane -t :8.top-left;  select-layout -t :8 -E'
bind-key -n 'C-S-9' if-shell 'tmux join-pane -d -t :9'  '' 'new-window -dt :9;  join-pane -d -t :9;  select-pane -t :9.top-left;  kill-pane -t :9.top-left;  select-layout -t :9 -E'
bind-key -n 'C-S-0' if-shell 'tmux join-pane -d -t :10' '' 'new-window -dt :10; join-pane -d -t :10; select-pane -t :10.top-left; kill-pane -t :10.top-left; select-layout -t :10 -E'

# BTab <shifted-num>: same "move current pane into workspace N" as C-S-<num>,
# but reachable without a CSI-u-capable terminal. Shifted digits map 1..0 to
# ! @ # $ % ^ & * ( ). These are the terminal-independent fallback for C-S-<num>.
# Note: % must be double-quoted ("%") -- tmux drops it if single-quoted.
bind '!' if-shell 'tmux join-pane -d -t :1'  '' 'new-window -dt :1;  join-pane -d -t :1;  select-pane -t :1.top-left;  kill-pane -t :1.top-left;  select-layout -t :1 -E'
bind '@' if-shell 'tmux join-pane -d -t :2'  '' 'new-window -dt :2;  join-pane -d -t :2;  select-pane -t :2.top-left;  kill-pane -t :2.top-left;  select-layout -t :2 -E'
bind '#' if-shell 'tmux join-pane -d -t :3'  '' 'new-window -dt :3;  join-pane -d -t :3;  select-pane -t :3.top-left;  kill-pane -t :3.top-left;  select-layout -t :3 -E'
bind '$' if-shell 'tmux join-pane -d -t :4'  '' 'new-window -dt :4;  join-pane -d -t :4;  select-pane -t :4.top-left;  kill-pane -t :4.top-left;  select-layout -t :4 -E'
bind "%" if-shell 'tmux join-pane -d -t :5'  '' 'new-window -dt :5;  join-pane -d -t :5;  select-pane -t :5.top-left;  kill-pane -t :5.top-left;  select-layout -t :5 -E'
bind '^' if-shell 'tmux join-pane -d -t :6'  '' 'new-window -dt :6;  join-pane -d -t :6;  select-pane -t :6.top-left;  kill-pane -t :6.top-left;  select-layout -t :6 -E'
bind '&' if-shell 'tmux join-pane -d -t :7'  '' 'new-window -dt :7;  join-pane -d -t :7;  select-pane -t :7.top-left;  kill-pane -t :7.top-left;  select-layout -t :7 -E'
bind '*' if-shell 'tmux join-pane -d -t :8'  '' 'new-window -dt :8;  join-pane -d -t :8;  select-pane -t :8.top-left;  kill-pane -t :8.top-left;  select-layout -t :8 -E'
bind '(' if-shell 'tmux join-pane -d -t :9'  '' 'new-window -dt :9;  join-pane -d -t :9;  select-pane -t :9.top-left;  kill-pane -t :9.top-left;  select-layout -t :9 -E'
bind ')' if-shell 'tmux join-pane -d -t :10' '' 'new-window -dt :10; join-pane -d -t :10; select-pane -t :10.top-left; kill-pane -t :10.top-left; select-layout -t :10 -E'

# Window management (prefix)
bind j previous-window
bind k next-window
bind h swap-window -t -1 \; select-window -t -1     # move window left
bind l swap-window -t +1 \; select-window -t +1     # move window right
bind w choose-tree -Zw                              # window/session picker
bind W command-prompt { find-window -Z "%%" }       # find window by name/text
bind q confirm-before -p "kill-window #W? (y/n)" kill-window
bind r command-prompt -I "#W" "rename-window '%%'"


# =============================================================================
#  8. LAYOUTS (BTab + letter; each re-spreads panes with select-layout -E)
# =============================================================================
bind -r y select-layout main-vertical   \; select-layout -E    # one big left pane
bind -r Y select-layout even-horizontal  \; select-layout -E   # equal columns
bind -r x select-layout main-horizontal  \; select-layout -E   # one big top pane
bind -r X select-layout even-vertical    \; select-layout -E   # equal rows
bind -r t select-layout tiled            \; select-layout -E   # fully tiled
bind    T clock-mode                                           # clock

# Cycle layouts in a fixed order (main-vertical -> even-horizontal ->
# main-horizontal -> even-vertical -> tiled -> wrap). Uses @lyt as the index;
# tmux's built-in next-layout uses a different order, hence this custom cycle.
set -g @lyt 0
bind -r c run-shell 'i=#{@lyt}; i=$(( (i+1) % 5 )); tmux set -g @lyt $i; \
  case $i in 0) L=main-vertical;; 1) L=even-horizontal;; 2) L=main-horizontal;; 3) L=even-vertical;; 4) L=tiled;; esac; \
  tmux select-layout "$L"; tmux select-layout -E'


# =============================================================================
#  9. PANES & SPLITS
# -----------------------------------------------------------------------------
#  C-Enter creates a pane the tilish way (bottom-right, keep cwd, re-tile).
#  C-Enter needs a kitty CSI-u map -- see kitty.conf; BTab Enter is the
#  terminal-independent fallback.
# =============================================================================
bind -n C-Enter run-shell 'cwd="#{pane_current_path}"; tmux select-pane -t bottom-right; tmux split-window -c "$cwd"; tmux select-layout -E'
# BTab Enter: terminal-independent fallback for C-Enter (new pane the tilish way).
bind Enter run-shell 'cwd="#{pane_current_path}"; tmux select-pane -t bottom-right; tmux split-window -c "$cwd"; tmux select-layout -E'
bind d kill-pane
bind m resize-pane -Z


# =============================================================================
# 10. SESSIONS
# =============================================================================
bind D detach
bind s choose-session
bind S command-prompt -I "#S" "rename-session '%%'"


# =============================================================================
# 11. COPY MODE (vi)
# =============================================================================
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

bind / copy-mode \; command-prompt -p "search down" "send -X search-forward '%%'"
bind ? copy-mode \; command-prompt -p "search up"   "send -X search-backward '%%'"


# =============================================================================
# 12. MISC
# =============================================================================
bind R source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Keybinding help: show the table (from the KEYBINDINGS heading up to the
# KEYBINDINGS_END marker) in a popup. Opens with BTab g; close with q (or Esc).
bind g display-popup -w 80 -h 90% -T " tmux keybindings " -E \
  "sed -n '/^#  KEYBINDINGS_START\$/,/^# KEYBINDINGS_END\$/{/KEYBINDINGS_START/d;/KEYBINDINGS_END/d;s/^# \\{0,1\\}//;p;}' ~/.tmux.conf | less -R"

# Clear screen. C-S-hjkl is avoided so that C-S-l stays available for this.
bind-key -n 'C-S-l' if-shell "$is_vim" 'send-keys C-S-l' 'send-keys C-l'
bind-key -n 'C-S-x' if-shell "$is_vim" 'send-keys C-S-x' 'send-keys C-l'
