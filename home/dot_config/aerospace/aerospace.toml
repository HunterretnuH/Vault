################################# AEROSPACE CONFIG ##################################

config-version = 2

#####################    GENERAL SETTINGS    #####################
#--1 Appereance:                    wallpaper, borders, gaps, font
    #--2 Gaps
    	gaps.inner.horizontal = 5
    	gaps.inner.vertical = 5
    	gaps.outer.left = 5
    	gaps.outer.bottom = 5
    	gaps.outer.top = 5
    	gaps.outer.right = 5

#--1 Behaviour                      windows, gaps
    #--2 Start AeroSpace at login
    start-at-login = false
    #--2 Workspaces
	persistent-workspaces = [] # In i3, all workspaces are phantom
    #--2 Windows
	# i3 doesn't have "normalizations" feature that why we disable them here.
	# But the feature is very helpful.
	# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
	# Give normalizations a chance and enable them back.
	enable-normalization-flatten-containers = false
	enable-normalization-opposite-orientation-for-nested-containers = false

	# Mouse follows focus when focused monitor changes
	on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

#++#++#++#++#++#++#++# END OF GENERAL SETTINGS 

#####################    GENERAL BINDINGS    #####################
[mode.main.binding]
#--1 Default apps, exit menu, screen lock, shell config, help
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    cmd-enter = 'exec-and-forget kitty --single-instance -d $HOME/Desktop'

    # Reload the configuration file 
    # cmd-ctrl-c = 'reload-config'

#++#++#++#++#++#++#++# END OF GENERAL BINDINGS

